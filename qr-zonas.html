<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR de zonas · DinoCaza AR</title>
<style>
  :root { --ink: #0e1b17; --amber: #f2a531; --line: #d9d2c0; }
  body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); background: #f4efe3; }
  header { padding: 20px max(16px, 4vw); display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.6rem; }
  label { display: flex; flex-direction: column; gap: 4px; font-weight: 800; font-size: .8rem; flex: 1; min-width: 260px; }
  input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); }
  button { font: inherit; font-weight: 800; padding: 10px 16px; border-radius: 99px; border: 0; background: var(--amber); cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 0 max(16px, 4vw) 32px; }
  .card { background: #fff; border: 2px dashed var(--line); border-radius: 18px; padding: 18px; text-align: center; break-inside: avoid; }
  .card svg { width: 100%; max-width: 220px; height: auto; }
  .card h2 { margin: 6px 0 2px; font-size: 1.2rem; }
  .card p { margin: 0; font-size: .85rem; color: #555; }
  .tag { display: inline-block; background: var(--ink); color: var(--amber); font-weight: 900; border-radius: 99px; padding: 3px 12px; font-size: .75rem; letter-spacing: .1em; }
  .url { font-family: monospace; font-size: .7rem; word-break: break-all; color: #777; margin-top: 6px; }
  @media print { header { display: none; } body { background: #fff; } .grid { padding: 0; } .card { page-break-inside: avoid; } }
</style>
</head>
<body>
<header>
  <div><h1>Códigos QR para los letreros del parque</h1><p style="margin:4px 0 0">Escanear el QR abre DinoCaza AR directamente en esa zona. Imprímelos con Ctrl + P.</p></div>
  <label>Dirección pública de la app (https)
    <input id="base" placeholder="https://tu-usuario.github.io/dinocaza-ar/index.html">
  </label>
  <button id="go">Generar</button>
</header>
<div class="grid" id="grid"></div>
<script src="vendor/qrcode.js"></script>
<script src="js/data.js"></script>
<script>
  var base = document.getElementById('base');
  base.value = location.href.replace(/qr-zonas\.html.*$/, 'index.html');
  function make() {
    var url = base.value.trim().split('#')[0];
    var items = [{ tag: 'ENTRADA', name: 'Bienvenida a DinoCaza AR', desc: 'Escanea para empezar la búsqueda del tesoro.', link: url }]
      .concat(DC.ZONES.map(function (z) { return { tag: 'ZONA ' + z.id, name: z.name, desc: 'Escanea para explorar esta zona.', link: url + '#zona-' + z.id }; }));
    document.getElementById('grid').innerHTML = items.map(function (it) {
      var q = qrcode(0, 'M'); q.addData(it.link); q.make();
      return '<div class="card"><span class="tag">' + it.tag + '</span>' + q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) +
        '<h2>' + it.name + '</h2><p>' + it.desc + '</p><div class="url">' + it.link + '</div></div>';
    }).join('');
  }
  document.getElementById('go').addEventListener('click', make);
  make();
</script>
</body>
</html>
